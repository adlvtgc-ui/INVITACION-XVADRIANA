<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light"> 
<title>Mis XV Años - Adri</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;400;600&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
:root {
color-scheme: light; 
--color-principal: #85386e;
--color-texto: #333333;
--color-dorado: #3b1138;
--fuente-titulos: 'Cinzel', serif;
--fuente-cuerpo: 'Montserrat', sans-serif;
--fuente-nombre: 'Alex Brush', cursive;
}

html { -webkit-text-size-adjust: 100%; }

body {
margin: 0; padding: 0;
background-image: linear-gradient(rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.45)), url('thumb-1920-1275718.jpg');
background-size: cover; background-position: center; background-attachment: fixed;
font-family: var(--fuente-cuerpo); color: var(--color-texto); text-align: center;
}

.container {
max-width: 500px; margin: 20px auto; padding: 20px 20px 30px 20px;
background: linear-gradient(rgba(249, 226, 245, 0.9), rgba(255, 250, 254, 0.30)), url('linea.jpg');
background-size: cover; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.12);
}

header { position: relative; padding: 5px 10px 0px 10px; }

.galeria-inicio {
position: relative; width: 260px; height: 200px; margin: 10px auto;
border-radius: 8px; border: 1px solid #B87333; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
overflow: hidden; background-color: #fff;
}

.galeria-inicio img {
position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
opacity: 0; transition: opacity 1s ease-in-out;
}
.galeria-inicio img.activa { opacity: 1; }

h1, h2, h3, h4 { font-family: var(--fuente-titulos); margin-bottom: 0; }
header h1 { font-size: 2.2rem; letter-spacing: 3px; color: var(--color-principal); margin: 0; }
header h2 { font-family: var(--fuente-nombre); font-size: 5.2rem; color: var(--color-principal); margin: 0; font-weight: normal; text-shadow: 2px 2px 4px #7B8B75; }

.contador-container { display: flex; justify-content: center; gap: 10px; margin: 15px auto 10px auto; }
.contador-item {
display: flex; flex-direction: column; align-items: center; background: rgba(242, 218, 236, 0.92);
border: 1px solid #B87333; border-radius: 8px; padding: 6px 8px; min-width: 45px;
}
.contador-numero { font-family: var(--fuente-titulos); font-size: 1.2rem; color: var(--color-principal); font-weight: bold; }
.contador-etiqueta { font-family: var(--fuente-cuerpo); font-size: 0.6rem; text-transform: uppercase; margin-top: 3px; font-weight: 600; }

.separador-header { width: 100%; max-width: 240px; margin: 15px auto; }
.separador-header img { width: 100%; height: auto; }

.card {
background: rgba(242, 218, 236, 0.92); border: 1px solid #B87333; border-radius: 8px;
margin: 10px 5px 25px 5px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
}

.card-title { color: var(--color-principal); font-size: 1.3rem; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; }
.separador-rizos { display: flex; align-items: center; justify-content: center; margin: 8px auto 15px auto; width: 80%; }
.linea-centro { width: 100%; height: 2px; background: linear-gradient(to right, transparent, #e2c0d9, var(--color-principal), #e2c0d9, transparent); }
.card-lugar { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; }
.info-row { margin: 8px 0; font-size: 0.9rem; font-family: var(--fuente-titulos); }

.btn {
display: inline-flex; align-items: center; justify-content: center; gap: 10px;
background-color: var(--color-dorado); color: #fff; padding: 9px 18px; text-decoration: none;
border-radius: 4px; font-weight: 600; margin-top: 12px; font-size: 0.85rem;
}

/* --- PASE DE ENTRADA (ESTILO RECORTABLE) --- */
#pase-entrada {
display: none;
background: linear-gradient(135deg, #4a1544, #2a0b27); /* Fondo más oscuro */
border: 2px dashed #d4af37; /* Borde tipo recortable */
border-radius: 0; /* Sin redondeo para aspecto de ticket */
margin-top: 30px; padding: 25px; position: relative;
}

#pase-entrada .card-title { color: #d4af37; font-family: var(--fuente-titulos); }
#pase-entrada .linea-centro { background: linear-gradient(to right, transparent, #d4af37, transparent); }

.pase-contenido {
margin: 15px 0; padding: 15px;
background-color: rgba(255, 255, 255, 0.05);
border: 1px solid #d4af37;
color: #fcfcfc; /* Texto claro para fondo oscuro */
font-family: var(--fuente-titulos);
}

.pase-destacado {
font-family: var(--fuente-titulos); font-weight: bold; font-size: 1.2rem;
display: block; margin-top: 5px; color: #d4af37;
}

.frase-final-container { margin: 15px auto 0 auto; text-align: center; }
.frase-final-texto { font-family: var(--fuente-titulos); font-size: 1.1rem; color: var(--color-principal); font-weight: bold; }
.img-final-pequena { width: 15%; max-width: 35px; margin: 0 auto; display: block; opacity: 0.95; }
</style>
</head>
<body>
<div class="container">
<!-- CONTENIDO (header, tarjetas...) -->

</div>
</body>
</html>
